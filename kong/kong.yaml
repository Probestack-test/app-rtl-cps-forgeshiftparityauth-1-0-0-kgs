########################################################
# SERVICES
########################################################

services:
  - name: forgeshiftparityauth-1-0-0
    host: postman-echo.com
    port: 443
    protocol: https
    retries: 5
    connect_timeout: 60000
    write_timeout: 60000
    read_timeout: 60000
    enabled: true
    tags:
      - wso2-source-id:3081da6c-0571-46ee-b455-003d96e43888
      - migrated-by:forgeshift-wso2-migrator
      - forgeshift-parity
      - proxyx-proxy-id:PX-B9DCF99BB751
    path: /
    routes:
      - name: forgeshiftparityauth-1-0-0--getget
        protocols:
          - http
          - https
        methods:
          - GET
          - OPTIONS
        paths:
          - ~/forgeshift\-parity/auth/1\.0\.0/get(?<wso2_rest>/)?$
        strip_path: false
        preserve_host: false
        https_redirect_status_code: 426
        regex_priority: 1023
        path_handling: v0
        request_buffering: true
        response_buffering: true
        tags:
          - wso2-source-id:3081da6c-0571-46ee-b455-003d96e43888
          - migrated-by:forgeshift-wso2-migrator
          - forgeshift-parity
          - wso2-resource:_get
          - wso2-verb:GET
          - proxyx-proxy-id:PX-B9DCF99BB751
      - name: forgeshiftparityauth-1-0-0--postpost
        protocols:
          - http
          - https
        methods:
          - POST
          - OPTIONS
        paths:
          - ~/forgeshift\-parity/auth/1\.0\.0/post(?<wso2_rest>/)?$
        strip_path: false
        preserve_host: false
        https_redirect_status_code: 426
        regex_priority: 1022
        path_handling: v0
        request_buffering: true
        response_buffering: true
        tags:
          - wso2-source-id:3081da6c-0571-46ee-b455-003d96e43888
          - migrated-by:forgeshift-wso2-migrator
          - forgeshift-parity
          - wso2-resource:_post
          - wso2-verb:POST
          - proxyx-proxy-id:PX-B9DCF99BB751

